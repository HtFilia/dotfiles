title = "Dotfiles secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Historical VS Code duplicate-line keyboard shortcut, not a credential"
condition = "AND"
regexTarget = "line"
paths = ['''^home/dot_config/Code/User/keybindings\.json$''']
regexes = ['''^\s*"key":\s*"shift\+alt\+down",?\s*$''']
