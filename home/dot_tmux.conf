# ~/.tmux.conf
# tmux configuration - Gruvbox Material Dark theme

# ============================================================================
# GENERAL
# ============================================================================
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB:clipboard:ccolour:cstyle:extkeys'
set -as terminal-features ',xterm-256color:RGB'
set -s extended-keys on
# OSC 52 copy reaches Ghostty on the laptop without xclip on the VPS.
set -s set-clipboard external

# Increase scrollback
set -g history-limit 100000

# Faster escape (for nvim)
set -sg escape-time 10

# Enable mouse
set -g mouse on

# Start window/pane indexing at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Increase repeat time
set -g repeat-time 1000

# Focus events (for nvim autoread)
set -g focus-events on

# ============================================================================
# KEYBINDINGS
# ============================================================================
# Change prefix to Ctrl-a (easier than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "󱘢  Config reloaded!"

# Split panes with | and - (keeping current path)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window with current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with H J K L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Copy mode (vi-style)
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Operator tmux: a small control room for shell, monitors and logs.
set -g status-position top
set -g status-interval 5
set -g status-style 'bg=#142727,fg=#9ab5ad'
set -g status-justify left
set -g status-left-length 34
set -g status-left '#[fg=#142727,bg=#75d1c2,bold] ◈ #S #[fg=#75d1c2,bg=#142727]  '
set -g status-right-length 96
set -g status-right '#[fg=#8ca69f]#{pane_current_command} #[fg=#55736d]│ #[fg=#9db9d6]#h #[fg=#8ca69f]│ %H:%M '
setw -g window-status-style 'fg=#6f8b84,bg=#142727'
setw -g window-status-format ' #I · #W '
setw -g window-status-current-style 'fg=#142727,bg=#e5bc70,bold'
setw -g window-status-current-format ' #I · #W#{?window_zoomed_flag, ⊞,} '
setw -g window-status-activity-style 'fg=#e5bc70,bg=#142727'
set -g pane-border-status top
set -g pane-border-format '#[fg=#55736d] ┤ #P #[fg=#9ab5ad]#{pane_current_command} #[fg=#55736d]├ '
set -g pane-border-style 'fg=#294742'
set -g pane-active-border-style 'fg=#75d1c2'
set -g message-style 'fg=#142727,bg=#e5bc70,bold'

# Local overrides.
if-shell 'test -f ~/.tmux.conf.local' 'source-file ~/.tmux.conf.local'
