# ~/.tmux.conf
# tmux configuration - Dusk palette

# ============================================================================
# GENERAL
# ============================================================================
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB:clipboard:ccolour:cstyle:extkeys:usstyle:hyperlinks'
set -as terminal-features ',xterm-256color:RGB'
set -s extended-keys on
# OSC 52 copy reaches Kitty on the workstation without xclip on the VPS.
set -s set-clipboard external

# Increase scrollback
set -g history-limit 100000

# Faster escape (for nvim)
set -sg escape-time 10

# Enable mouse
set -g mouse on

# Start window/pane indexing at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Increase repeat time
set -g repeat-time 1000

# Focus events (for nvim autoread)
set -g focus-events on

# ============================================================================
# KEYBINDINGS
# ============================================================================
# Reload config
bind r source-file ~/.tmux.conf \; display "󱘢  Config reloaded!"

# Default split keys, keeping the current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# New window with current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with H J K L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Copy mode (vi-style)
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Status line and pane borders in the Dusk palette, matching Kitty's tab bar.
set -g status-position top
set -g status-interval 5
set -g status-style 'bg=#1D1B19,fg=#C9C0B8'
set -g status-justify left
set -g status-left-length 34
set -g status-left '#[fg=#24211F,bg=#8FB39A,bold] ◈ #S #[fg=#8FB39A,bg=#1D1B19]  '
set -g status-right-length 96
set -g status-right '#[fg=#C9C0B8]#{pane_current_command} #[fg=#7C736D]│ #[fg=#8FAFD3]#h #[fg=#7C736D]│ #[fg=#C9C0B8]%H:%M '
setw -g window-status-style 'fg=#7C736D,bg=#1D1B19'
setw -g window-status-format ' #I · #W '
setw -g window-status-current-style 'fg=#24211F,bg=#AE9FDB,bold'
setw -g window-status-current-format ' #I · #W#{?window_zoomed_flag, ⊞,} '
setw -g window-status-activity-style 'fg=#D9B26F,bg=#1D1B19'
set -g pane-border-status top
set -g pane-border-format '#[fg=#7C736D] ┤ #P #[fg=#C9C0B8]#{pane_current_command} #[fg=#7C736D]├ '
set -g pane-border-style 'fg=#3D3936'
set -g pane-active-border-style 'fg=#AE9FDB'
set -g message-style 'fg=#24211F,bg=#D9B26F,bold'

# Machine-specific settings, loaded last so they win.
source-file -q ~/.tmux.conf.local
