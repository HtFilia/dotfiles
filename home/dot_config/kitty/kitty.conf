# ~/.config/kitty/kitty.conf
# Kitty terminal: Operator palette, Fira Code, splits.
# Kitty bundles the Nerd Font symbols used by Starship and eza.

# Font
font_family      family="Fira Code" features=+ss01
font_size        14.0

# Operator palette
foreground            #e5f0ea
background            #142727
cursor                #e5bc70
cursor_text_color     #142727
selection_foreground  #e5f0ea
selection_background  #294742
url_color             #9db9d6
color0   #142727
color1   #e98a8a
color2   #75d1c2
color3   #e5bc70
color4   #9db9d6
color5   #b8a7d9
color6   #75d1c2
color7   #e5f0ea
color8   #55736d
color9   #f0a1a1
color10  #9be2d6
color11  #f2d08e
color12  #b8cde3
color13  #cbbde6
color14  #9be2d6
color15  #f7fbf8

# Tabs and split borders follow the tmux status line.
tab_bar_edge             top
tab_bar_background       #142727
active_tab_foreground    #142727
active_tab_background    #e5bc70
inactive_tab_foreground  #6f8b84
inactive_tab_background  #142727
active_border_color      #75d1c2
inactive_border_color    #294742

# Window: translucent background, blurred on macOS and KDE Plasma.
background_opacity    0.97
background_blur       12
window_padding_width  14 16
cursor_shape          beam
scrollback_lines      100000
mouse_hide_wait       -1
copy_on_select        clipboard
shell_integration     enabled
# Keep the right Option key available for accented characters on macOS.
macos_option_as_alt   left

# Shortcuts that differ from Kitty's defaults.
enabled_layouts splits,stack
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+d     launch --location=vsplit --cwd=current
map ctrl+shift+e     launch --location=hsplit --cwd=current
map ctrl+alt+left    neighboring_window left
map ctrl+alt+right   neighboring_window right
map ctrl+alt+up      neighboring_window up
map ctrl+alt+down    neighboring_window down
map ctrl+plus        change_font_size all +1.0
map ctrl+equal       change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0
map ctrl+shift+k     clear_terminal reset active

# Machine-specific settings, such as a font size for one screen.
globinclude kitty.d/*.conf
