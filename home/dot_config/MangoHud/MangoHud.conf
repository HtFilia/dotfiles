# MangoHud overlay, deployed only when gaming is enabled. Start a game with
# `mangohud %command%` in Steam's launch options, or MANGOHUD=1 elsewhere.
# Right Shift + F12 toggles it. Colours follow the Operator palette.
position=top-left
toggle_hud=Shift_R+F12
font_size=20
background_alpha=0.6
background_color=142727
text_color=E5F0EA
fps
frametime
frame_timing
cpu_stats
cpu_color=75D1C2
gpu_stats
gpu_color=9DB9D6
ram
vram
gamemode
