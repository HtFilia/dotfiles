# MangoHud overlay, deployed only when gaming is enabled. Start a game with
# `mangohud %command%` in Steam's launch options, or MANGOHUD=1 elsewhere.
# Right Shift + F12 toggles it. Colours follow the Melange palette.
position=top-left
toggle_hud=Shift_R+F12
font_size=20
background_alpha=0.6
background_color=292522
text_color=ECE1D7
fps
frametime
frame_timing
cpu_stats
cpu_color=85B695
gpu_stats
gpu_color=A3A9CE
ram
vram
gamemode
