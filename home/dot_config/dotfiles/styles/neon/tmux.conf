# Native tmux formats: no subprocess polling.
set -g status-position top
set -g status-interval 5
set -g status-style 'bg=#080d16,fg=#c8e6ee'
set -g status-left-length 50
set -g status-left '#[fg=#080d16,bg=#49d7ff,bold] ◈ #S #[default] '
set -g status-right-length 90
set -g status-right '#[fg=#59ffb1]◉ #{pane_current_command} #[fg=#ff59cf]#{client_width}×#{client_height} #[fg=#49d7ff]#h │ %H:%M '
setw -g window-status-format ' #I · #W '
setw -g window-status-current-format '#[fg=#080d16,bg=#ff59cf,bold] #I · #W #{?window_zoomed_flag,⊞,} '
set -g pane-border-style 'fg=#234052'
set -g pane-active-border-style 'fg=#49d7ff'
set -g pane-border-status top
set -g pane-border-format '#[fg=#49d7ff] ┤ #P #{pane_current_command} ├ '
set -g message-style 'bg=#49d7ff,fg=#080d16,bold'
