# Studio tmux: compact bottom status bar and quiet pane borders.
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#111418,fg=#9aa7b4'
set -g status-justify left
set -g status-left-length 28
set -g status-left '#[fg=#111418,bg=#69d1c5,bold] #S #[default]'
set -g status-right-length 64
set -g status-right '#[fg=#64717e]#h #[fg=#9aa7b4]│ %H:%M '
setw -g window-status-style 'fg=#64717e,bg=#111418'
setw -g window-status-format ' #I #W '
setw -g window-status-current-style 'fg=#111418,bg=#e4b86a,bold'
setw -g window-status-current-format ' #I #W#{?window_zoomed_flag, ⊞,} '
setw -g window-status-activity-style 'fg=#e4b86a,bg=#111418'
set -g pane-border-style 'fg=#29323b'
set -g pane-active-border-style 'fg=#69d1c5'
set -g message-style 'fg=#111418,bg=#e4b86a,bold'
