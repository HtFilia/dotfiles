# Native tmux formats: no subprocess polling.
set -g status-position top
set -g status-interval 5
set -g status-style 'bg=#061009,fg=#c4ffd4'
set -g status-left-length 50
set -g status-left '#[fg=#061009,bg=#43ff75,bold] ◈ #S #[default] '
set -g status-right-length 90
set -g status-right '#[fg=#b4ff59]◉ #{pane_current_command} #[fg=#22bba9]#{client_width}×#{client_height} #[fg=#43ff75]#h │ %H:%M '
setw -g window-status-format ' #I · #W '
setw -g window-status-current-format '#[fg=#061009,bg=#22bba9,bold] #I · #W #{?window_zoomed_flag,⊞,} '
set -g pane-border-style 'fg=#234052'
set -g pane-active-border-style 'fg=#43ff75'
set -g pane-border-status top
set -g pane-border-format '#[fg=#43ff75] ┤ #P #{pane_current_command} ├ '
set -g message-style 'bg=#43ff75,fg=#061009,bold'
