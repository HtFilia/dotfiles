# Operator: a compact control-room prompt for active work.
add_newline = true
command_timeout = 500
format = "[┌─](bold #75d1c2)$directory$git_branch$git_status$line_break[└─](bold #75d1c2)$character"
right_format = "$username$hostname$python$nodejs$rust$golang$cmd_duration"

[username]
show_always = false
format = "[$user]($style)@"
style_user = "#94aaa5"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "#9db9d6"

[directory]
format = "[ $path]($style)[$read_only]($read_only_style) "
style = "bold #75d1c2"
read_only = " "
read_only_style = "#e5bc70"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
format = "[│ $branch]($style) "
style = "#9db9d6"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "#e5bc70"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2_000
format = "[· $duration]($style) "
style = "#8ca69f"

[python]
format = "[py $version]($style) "
style = "#e5bc70"

[nodejs]
format = "[node $version]($style) "
style = "#75d1c2"

[rust]
format = "[rs $version]($style) "
style = "#e98a8a"

[golang]
format = "[go $version]($style) "
style = "#9db9d6"

[character]
success_symbol = "[❯](bold #e5bc70)"
error_symbol = "[✗](bold #e98a8a)"
vimcmd_symbol = "[❮](bold #75d1c2)"
