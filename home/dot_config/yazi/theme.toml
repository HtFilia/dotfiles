# Dusk accents over yazi's default theme, matching Kitty and tmux.
# The rest of the default theme uses the terminal's ANSI colours, which Kitty
# already maps to Dusk.

[mgr]
cwd            = { fg = "#AE9FDB", bold = true }
find_keyword   = { fg = "#D9B26F", bold = true, underline = true }
find_position  = { fg = "#D9A0A0", bold = true }
border_symbol  = "│"
border_style   = { fg = "#3D3936" }

[tabs]
active   = { fg = "#24211F", bg = "#AE9FDB", bold = true }
inactive = { fg = "#7C736D", bg = "#1D1B19" }

[mode]
normal_main = { fg = "#24211F", bg = "#AE9FDB", bold = true }
normal_alt  = { fg = "#AE9FDB", bg = "#2D2A28" }
select_main = { fg = "#24211F", bg = "#8FB39A", bold = true }
select_alt  = { fg = "#8FB39A", bg = "#2D2A28" }
unset_main  = { fg = "#24211F", bg = "#E08C8C", bold = true }
unset_alt   = { fg = "#E08C8C", bg = "#2D2A28" }

[indicator]
parent  = { fg = "#E4DDD6", bg = "#3D3936" }
current = { fg = "#E4DDD6", bg = "#3D3936", bold = true }
preview = { underline = true }

[status]
perm_sep   = { fg = "#7C736D" }
perm_type  = { fg = "#8FB39A" }
perm_read  = { fg = "#D9B26F" }
perm_write = { fg = "#E08C8C" }
perm_exec  = { fg = "#86B8B4" }
progress_normal = { fg = "#8FB39A", bg = "#2D2A28" }
progress_error  = { fg = "#D9B26F", bg = "#E08C8C" }

[which]
border = { fg = "#AE9FDB" }
cand   = { fg = "#86B8B4" }
rest   = { fg = "#7C736D" }
desc   = { fg = "#D9A0A0" }

[input]
border = { fg = "#AE9FDB" }

[confirm]
border = { fg = "#AE9FDB" }
title  = { fg = "#AE9FDB" }

[pick]
border = { fg = "#AE9FDB" }
active = { fg = "#D9A0A0", bold = true }

[cmp]
border = { fg = "#AE9FDB" }

[tasks]
border  = { fg = "#AE9FDB" }
hovered = { fg = "#D9A0A0", bold = true }

[help]
border  = { fg = "#AE9FDB" }
chord   = { fg = "#86B8B4" }
hovered = { fg = "#E4DDD6", bg = "#3D3936", bold = true }
