# yazi: hidden files shown, directories first, sizes beside names.
# Defaults: https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/yazi-default.toml

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 8

[preview]
wrap     = "no"
tab_size = 4
