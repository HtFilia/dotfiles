# yazi keys for a French AZERTY keyboard: the default tab keys are the digits
# and the brackets. t still opens a tab; F1 shows the help that ~ shows.
# Defaults: https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/keymap-default.toml

[mgr]
prepend_keymap = [
  { on = "<A-h>", run = "tab_switch -1 --relative", desc = "Previous tab" },
  { on = "<A-l>", run = "tab_switch 1 --relative", desc = "Next tab" },
  { on = "<A-H>", run = "tab_swap -1", desc = "Move the tab left" },
  { on = "<A-L>", run = "tab_swap 1", desc = "Move the tab right" },
]
