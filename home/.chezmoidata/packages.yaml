# Packages installed by the run_onchange_before_10-packages-* scripts.
#
# On each machine the script for its operating system installs whatever is
# missing from the "common" list, then from the lists named after the
# machine's profile (workstation, server), its context (perso, travail) and,
# when enabled, gaming. Lists that do not exist are skipped. Editing a list
# changes the rendered script, so the next `chezmoi apply` runs it again.
packages:
  fedora:
    # COPR repositories enabled before installing their packages.
    copr:
      - atim/starship
      - atim/lazygit
      # Plasma appearance: Klassy window decoration and Bibata cursors.
      - errornointernet/klassy
      - peterwu/rendezvous
    common:
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - chezmoi
      - git
      - kitty
      - fira-code-fonts
      - tmux
      - neovim
      - starship
      - lazygit
      - fzf
      - ripgrep
      - fd-find
      - bat
      - eza
      - zoxide
      - git-delta
      - jq
      - just
      - htop
      - gh
      - tealdeer
      - fastfetch
      - hyperfine
      - du-dust
      - yq
      - uv
      - rustup
      - nodejs24
      - nodejs24-bin
      - nodejs24-npm-bin
      - podman
      - podman-compose
      - ShellCheck
      - shfmt
      - gitleaks
      - wl-clipboard
      # yazi itself is pinned in .chezmoiexternal; these give it PDF and
      # video previews.
      - poppler-utils
      - ffmpegthumbnailer
      - navi
      - difftastic
      - procs
      # Builds the Treesitter parsers listed under `editor` below.
      - tree-sitter-cli
      # From Microsoft's repository, which the Fedora script configures.
      - code
    perso:
      - golang
      - gcc-c++
      - cmake
      - ninja-build
      - clang-tools-extra
      - gdb
      # Plasma appearance on top of the Dusk colour scheme.
      - klassy
      - bibata-cursor-themes
      - papirus-icon-theme
      - rsms-inter-fonts
      - jetbrains-mono-fonts
      # Plymouth boot splash (the Dusk Ridge theme) uses the script module.
      - plymouth-plugin-script
    gaming:
      - gamemode

  debian:
    # Official Debian 13 repositories only.
    common:
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - ca-certificates
      - curl
      - git
      - tmux
      - starship
      - lazygit
      - fzf
      - ripgrep
      - fd-find
      - bat
      - eza
      - zoxide
      - git-delta
      - jq
      - just
      - htop
      - tealdeer
      - shellcheck
      - shfmt
      - gitleaks
      - nodejs
      - npm
    workstation:
      - kitty
      - fonts-firacode
      - gh
      - fastfetch
      - hyperfine
      - du-dust
      - rustup
      - podman
      - podman-compose
      - wl-clipboard
      - xclip
    server:
      - kitty-terminfo
      - openssh-client
      - python3
      - python3-venv
      - build-essential
      - ncurses-bin
      - ncurses-term
      - less
      - man-db
      - bsdextrautils
      - util-linux
      - unzip
      - xz-utils
      - ncdu
      - iproute2
      - bind9-dnsutils
      - iputils-ping
      - procps

# Language servers and Treesitter parsers for Neovim, installed by
# run_onchange_after_45-editor-tools. Versions are pinned here; `just outdated`
# reports newer ones. Lists are named like the package lists above (common,
# then the profile). clangd comes from the system packages.
editor:
  # uv tool install: Pyrefly (types, navigation) and Ruff (lint, format).
  uv:
    common:
      - pyrefly==1.4.1
      - ruff==0.17.5
  # npm install --global --prefix ~/.local. typescript stays on 6.x:
  # typescript-language-server drives tsserver, which TypeScript 7 no longer ships.
  npm:
    common:
      - bash-language-server@5.8.1
    workstation:
      - typescript-language-server@6.1.0
      - typescript@6.0.3
  # rustup component add, with the stable toolchain.
  rustup:
    workstation:
      - rust-analyzer
  # Fedora only: nvim-treesitter needs tree-sitter-cli 0.26, and Debian 13
  # ships 0.22. Neovim bundles the C, Lua, Markdown and Vim parsers.
  parsers:
    - bash
    - python
    - rust
    - javascript
    - typescript
    - tsx
    - json
    - toml
    - yaml
    - cpp
    - cmake

# VS Code extensions, installed where VS Code is: always on Fedora,
# and on a Debian workstation once someone has installed `code`.
vscode:
  common:
    - sainnhe.gruvbox-material
    - PKief.material-icon-theme
    - PKief.material-product-icons
    - usernamehw.errorlens
    - eamodio.gitlens
    - editorconfig.editorconfig
    - christian-kohler.path-intellisense
    - streetsidesoftware.code-spell-checker
    - gruntfuggly.todo-tree
    - aaron-bond.better-comments
    - ms-python.python
    - ms-python.vscode-pylance
    - ms-python.debugpy
    - charliermarsh.ruff
    - rust-lang.rust-analyzer
    - tamasfe.even-better-toml
    - redhat.vscode-yaml
    - bradlc.vscode-tailwindcss
    - ms-vscode-remote.remote-ssh
    - ms-vscode-remote.remote-containers
    - mikestead.dotenv
  # GitHub Copilot is built into VS Code and cannot be installed separately.
  perso:
    - anthropic.claude-code
    - golang.go
    - llvm-vs-code-extensions.vscode-clangd
