name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  scripts:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Linux check tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh python3
          . scripts/pinned-assets.sh
          mkdir -p "$HOME/.local/bin"
          for specification in chezmoi:chezmoi-linux-amd64 actionlint:actionlint-linux-amd64 gitleaks:gitleaks-linux-x64; do
            tool="${specification%%:*}"
            key="${specification#*:}"
            archive="$(cached_asset_path "$key" "$RUNNER_TEMP/assets")"
            stage="$(mktemp -d)"
            extract_pinned_archive "$archive" "$stage"
            install -m 755 "$stage/$tool" "$HOME/.local/bin/$tool"
            rm -rf "$stage"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install macOS check tools
        if: runner.os == 'macOS'
        run: brew install shellcheck chezmoi actionlint gitleaks python

      - name: Syntax and ShellCheck
        run: |
          for file in scripts/*.sh tests/*.sh; do bash -n "$file"; done
          for file in home/dot_zsh*; do zsh -n "$file"; done
          shellcheck scripts/*.sh tests/*.sh

      - name: Behavioral regressions
        run: bash tests/script-contracts.sh

      - name: Workflow lint
        run: actionlint

      - name: Secret scan
        run: gitleaks git --redact --no-banner

      - name: Asset inventory consistency
        run: |
          scripts/asset-manifest.sh > "$RUNNER_TEMP/assets.md"
          diff -u docs/ASSET-MANIFEST.md "$RUNNER_TEMP/assets.md"
