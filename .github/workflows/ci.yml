name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  corporate-debian:
    name: Corporate Debian (${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [bookworm, trixie]
    # Public CI fixtures; this does not authorize corporate image acquisition.
    container: debian:${{ matrix.release }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 passwd sudo
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Provision administrator-owned APT dependencies
        run: |
          . scripts/corporate-packages.sh
          apt-get install -y --no-install-recommends "${corporate_packages[@]}"
      - name: Prepare isolated corporate account and checkout
        run: |
          useradd -m -s /bin/bash dotfiles-ci
          git -c safe.directory="$GITHUB_WORKSPACE" clone --no-hardlinks "$GITHUB_WORKSPACE" /home/dotfiles-ci/dotfiles
          git -C /home/dotfiles-ci/dotfiles switch -C environment/corporate "$GITHUB_SHA"
          chown -R dotfiles-ci:dotfiles-ci /home/dotfiles-ci/dotfiles
      - name: Provision workstation twice and verify
        env:
          DOTFILES_GIT_NAME: Corporate CI
          DOTFILES_GIT_EMAIL: ci@example.invalid
        run: |
          # shellcheck disable=SC2016
          runuser -u dotfiles-ci -- bash -euc '
            cd "$HOME/dotfiles"
            scripts/bootstrap.sh --yes --skip-packages --skip-docker --skip-fonts
            scripts/verify.sh --profile workstation
            stat -c "%n %Y %i" "$HOME/.local/bin/tmux" "$HOME/.local/bin/pnpm" "$HOME/.local/bin/biome" "$HOME/.local/bin/tree-sitter" > /tmp/corporate-before
            scripts/bootstrap.sh --yes --skip-packages --skip-docker --skip-fonts
            scripts/verify.sh --profile workstation
            stat -c "%n %Y %i" "$HOME/.local/bin/tmux" "$HOME/.local/bin/pnpm" "$HOME/.local/bin/biome" "$HOME/.local/bin/tree-sitter" > /tmp/corporate-after
            diff -u /tmp/corporate-before /tmp/corporate-after
          '
      - name: Syntax, behavior, workflow, secrets and asset consistency
        run: |
          # shellcheck disable=SC2016
          runuser -u dotfiles-ci -- bash -euc '
            export PATH="$HOME/.local/bin:$PATH"
            cd "$HOME/dotfiles"
            just check
            just workflow
            just security
            scripts/asset-manifest.sh > /tmp/corporate-assets.md
            diff -u docs/ASSET-MANIFEST.md /tmp/corporate-assets.md
          '
